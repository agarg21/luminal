name: Test Python Native

on:
    push:
        branches: ["main"]
    pull_request:
        branches: ["main"]
    workflow_dispatch:

env:
    LUMINAL_LOG: "1"

jobs:
    python_native_tests:
        name: Python Native Tests
        runs-on: ubuntu-latest
        container:
            image: ghcr.io/luminal-ai/luminal-docker:cpu
        timeout-minutes: 60
        steps:
            - uses: actions/checkout@v6
            - name: CPU info (measurement)
              run: nproc && free -g
            - name: Update Rust toolchain
              run: rustup update
            - name: Build and test PyTorch reference backend
              run: bash crates/pytorch/reference/run_tests.sh -v -m "not slow" --ignore=../utils/tests/test_opinfo.py -k "not (test_ordering_ops_on_narrow_storage_match_bitwise and max_pool1d_indices)"
