name: Test Python Native

on:
    push:
        branches: ["main"]
    pull_request:
        branches: ["main"]
    workflow_dispatch:

env:
    LUMINAL_LOG: "1"
    # Optimize workspace crates too (deps are already opt-level 3 via
    # [profile.dev.package."*"]); debug-assertions stay on.
    CARGO_PROFILE_DEV_OPT_LEVEL: "2"

jobs:
    python_native_tests:
        name: Python Native Tests
        runs-on: ubuntu-latest
        container:
            image: ghcr.io/luminal-ai/luminal-docker:cpu
        timeout-minutes: 45
        steps:
            - uses: actions/checkout@v6
            - name: CPU info (measurement)
              run: nproc && free -g
            - name: Update Rust toolchain
              run: rustup update
            - name: Build and test PyTorch reference backend
              run: bash crates/pytorch/reference/run_tests.sh -v -m "not slow" --ignore=../utils/tests/test_opinfo.py
